name: Quality CI

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Check formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint

  backend-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

  frontend-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Run frontend tests
        run: npm test
        working-directory: client

      - name: Build frontend
        run: npm run build
        working-directory: client

  deploy-render:
    runs-on: ubuntu-latest
    needs:
      - quality-checks
      - backend-checks
      - frontend-checks
    if: github.event_name == 'push'

    steps:
      - name: Auto deploy Render
        run: curl -X POST -fsS "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
